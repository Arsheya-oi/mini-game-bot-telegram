<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>بازی‌های گروهی</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- استایل‌ها -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="app">
        <!-- ====== منوی اصلی ====== -->
        <div id="menu">
            <div class="header">
                <h1>🎮 بازی‌های گروهی</h1>
                <p class="subtitle">یک بازی رو انتخاب کن و شروع کن!</p>
            </div>

            <div class="game-list">
                <button class="game-btn" data-game="rps">🪨📄✂️ سنگ کاغذ قیچی</button>
                <button class="game-btn" data-game="golpoch">🤲 گل یا پوچ</button>
                <button class="game-btn" data-game="xo">❌🟢 دوز</button>
                <button class="game-btn" data-game="morris">🔄 دوز متحرک</button>
                <button class="game-btn" data-game="hokm">🃏 حکم</button>
                <button class="game-btn" data-game="mafia">🕵️ مافیا</button>
                <button class="game-btn" data-game="quiz">🧠 کوییز</button>
                <button class="game-btn" data-game="hangman">🎯 دار بازی</button>
                <button class="game-btn" data-game="tournament">🏆 تورنمنت</button>
                <button class="game-btn highlight" data-game="blackjack">🃏 ۲۱ با پاسور</button>
            </div>

            <div class="footer">
                <span>🔹 توسط ربات شما</span>
            </div>
        </div>

        <!-- ====== صفحه بازی ====== -->
        <div id="game-container" style="display:none;">
            <div id="game-header">
                <button id="back-btn">🔙 بازگشت</button>
                <span id="game-title">بازی</span>
            </div>
            <div id="game-content">
                <div class="loading">⏳ در حال آماده‌سازی...</div>
            </div>
        </div>
    </div>

    <!-- جاوااسکریپت (بعداً اضافه میشه) -->
    <script src="app.js"></script>
</body>
</html>
